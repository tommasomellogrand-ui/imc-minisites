name: Deploy IMC Minisites Shared Core to Aruba

on:
  push:
    branches: [main]
    paths:
      - 'shared/app-core.js'
      - '.github/workflows/deploy-shared-app-core-aruba.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imc-minisites-shared-core-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate shared app core
        shell: bash
        run: |
          set -euo pipefail
          test -s shared/app-core.js
          node --check shared/app-core.js
          grep -q "IMC_MINISITE_DATA" shared/app-core.js
          grep -q "minisite_read" shared/app-core.js

      - name: Deploy shared app core to Aruba
        env:
          ARUBA_FTP_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_FTP_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ARUBA_FTP_USERNAME:-}"
          test -n "${ARUBA_FTP_PASSWORD:-}"
          python3 - <<'PY'
          import io, os, ssl
          from ftplib import FTP_TLS, error_perm
          from pathlib import Path

          host='ftp.italianmastersclub.it'
          port=21
          username=os.environ['ARUBA_FTP_USERNAME']
          password=os.environ['ARUBA_FTP_PASSWORD']
          local=Path('shared/app-core.js')
          remote_dir='/www.italianmastersclub.it/minisite/shared'

          ctx=ssl.create_default_context()
          ctx.check_hostname=False
          ftp=FTP_TLS(context=ctx)
          ftp.connect(host, port, timeout=60)
          ftp.login(username, password)
          ftp.prot_p()
          ftp.set_pasv(True)

          ftp.cwd('/')
          for part in [p for p in remote_dir.split('/') if p]:
              try:
                  ftp.cwd(part)
              except error_perm:
                  ftp.mkd(part)
                  ftp.cwd(part)

          data=local.read_bytes()
          with local.open('rb') as fh:
              ftp.storbinary('STOR app-core.js', fh)
          check=io.BytesIO()
          ftp.retrbinary('RETR app-core.js', check.write)
          if check.getvalue() != data:
              raise SystemExit('Verifica upload app-core.js fallita')
          ftp.quit()
          print('Shared app-core.js pubblicato e verificato byte-per-byte')
          PY

      - name: Verify live shared core
        shell: bash
        run: |
          set -euo pipefail
          url="https://italianmastersclub.it/minisite/shared/app-core.js?verify=${GITHUB_SHA}"
          body="$(curl --fail --silent --show-error --location --max-time 30 "$url")"
          printf '%s' "$body" | grep -q "IMC_MINISITE_DATA"
          printf '%s' "$body" | grep -q "minisite_read"
          echo "Live shared core verified"
